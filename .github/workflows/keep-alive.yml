name: Keep Render & Neon Alive

on:
  schedule:
    - cron: '*/5 * * * *' # Every 5 minutes
  workflow_dispatch:      # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint with retries
        run: |
          # Use -s for silent, -f to fail on HTTP errors, and --retry to handle transient network issues.
          # -w prints the HTTP status code for verification.
          HTTP_STATUS=$(curl -s -f --retry 5 --retry-delay 3 --retry-connrefused -w "%{http_code}" -o /dev/null https://taskora-api-df40.onrender.com/api/v1/health/)
          echo "✅ Backend responded with HTTP status: $HTTP_STATUS"
