name: Temporary dependency remediation check

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  npm-remediation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Remove unused production devtools and update router
        run: |
          npm ci
          npm uninstall @tanstack/react-query-devtools
          npm install react-router-dom@^7.18.4
          npm audit fix
      - name: Verify frontend
        run: |
          npm run lint
          npm run build
          npm run test -- --run
      - name: Report remaining advisories
        shell: bash
        run: |
          npm audit --json > /tmp/audit-all.json || true
          npm audit --omit=dev --json > /tmp/audit-prod.json || true
          node - <<'NODE'
          const fs = require('fs');
          for (const [label, path] of [['ALL', '/tmp/audit-all.json'], ['PRODUCTION', '/tmp/audit-prod.json']]) {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            console.log(label + ' SUMMARY:', JSON.stringify(report.metadata?.vulnerabilities || {}));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              console.log(label + ':', JSON.stringify({name, severity:item.severity, direct:item.isDirect, range:item.range, fixAvailable:item.fixAvailable}));
            }
          }
          NODE
      - name: Commit verified manifest changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): remediate npm security advisories"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "No manifest changes to commit."
          fi
