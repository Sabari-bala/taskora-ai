name: Temporary dependency audit report

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit all dependencies
        shell: bash
        run: |
          npm audit --json > /tmp/audit-all.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/audit-all.json', 'utf8'));
          console.log('ALL DEPENDENCIES SUMMARY:', JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log('ALL:', JSON.stringify({name, severity:item.severity, direct:item.isDirect, range:item.range, via:item.via.map(v=>typeof v==='string'?v:{name:v.name,title:v.title,url:v.url,range:v.range}), fixAvailable:item.fixAvailable}));
          }
          NODE
      - name: Audit production dependencies
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/audit-prod.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/audit-prod.json', 'utf8'));
          console.log('PRODUCTION DEPENDENCIES SUMMARY:', JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log('PRODUCTION:', JSON.stringify({name, severity:item.severity, direct:item.isDirect, range:item.range, via:item.via.map(v=>typeof v==='string'?v:{name:v.name,title:v.title,url:v.url,range:v.range}), fixAvailable:item.fixAvailable}));
          }
          NODE
