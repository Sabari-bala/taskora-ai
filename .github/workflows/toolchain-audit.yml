name: Temporary dev-toolchain security verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  toolchain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Upgrade vulnerable development toolchain
        run: |
          npm ci
          npm install --save-dev vite@^8.3.5 @vitejs/plugin-react@latest tailwindcss@^4.3.3 @tailwindcss/vite@latest vitest@^4.1.12
          npm audit fix || true
      - name: Verify frontend
        run: |
          npm run lint
          npm run build
          npm run test -- --run --passWithNoTests
      - name: Report dependency audit
        shell: bash
        run: |
          npm audit --json > /tmp/audit-all.json || true
          npm audit --omit=dev --json > /tmp/audit-prod.json || true
          node - <<'NODE'
          const fs = require('fs');
          for (const [label, path] of [['ALL', '/tmp/audit-all.json'], ['PRODUCTION', '/tmp/audit-prod.json']]) {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            console.log(label + ' SUMMARY:', JSON.stringify(report.metadata?.vulnerabilities || {}));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              console.log(label + ':', JSON.stringify({name, severity:item.severity, direct:item.isDirect, range:item.range, fixAvailable:item.fixAvailable}));
            }
          }
          NODE
      - name: Commit verified dependency changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): upgrade vulnerable frontend toolchain"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "No dependency manifest changes."
          fi
