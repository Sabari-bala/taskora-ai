[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["migrations", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"**/tests/*.py" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py313"]
exclude = "migrations"